# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: vi
languages: [vi, en]
default_lang: vi
lang_vars: [lang]
parallel_localization: false
exclude_from_localization:
  - assets/css
  - assets/img
  - assets/lib
  - assets/js/dist
  - assets/js/language.js
  - sw.js
  - app.js

# Change to your timezone
timezone: Asia/Bangkok

# jekyll-seo-tag settings
# ↓ --------------------------

title: Nemztran # the main title

tagline: Vulnerability Research & Writeups # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  Blog cá nhân của Namchan chia sẻ các bài nghiên cứu lỗ hổng bảo mật
  (Vulnerability Research), phân tích CVE, Web Exploitation và CTF Writeups

# Fill in the protocol & hostname for your site.
url: "https://nemztran.github.io"

github:
  username: Nemztran

social:
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Tran Dinh Nam
  email: dinhnam13052006@gmail.com
  links:
    - https://github.com/Nemztran
    - https://www.facebook.com/namtrann1305
    - https://www.linkedin.com/in/nam-tr%E1%BA%A7n-73a13b338/

theme_mode: dark

# the avatar on sidebar, support local or CORS resources
avatar: "https://github.com/Nemztran.png"

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image:

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  edit_post:
    enabled: false
    url: 
    static_url: false

comments:
  provider: 
  giscus:
    repo: Nemztran/nemztran.github.io
    repo_id: ""
    category: "Announcements"
    category_id: ""
    mapping: "pathname"
    strict: 0
    input_position: "bottom"
    lang: "vi"
    reactions_enabled: 1

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      # - "/example"

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed
  sourcemap: never

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - vendor
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
